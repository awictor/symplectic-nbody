<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="monospace">
<rect width="760" height="420" fill="#0d1117"/>
<text x="20" y="28" fill="#e6edf3" font-size="18">LZW compression ratio improves with repetition</text>
<text x="20" y="47" fill="#8b949e" font-size="12">codes/bytes falls as the same phrase repeats -- the dictionary learns longer substrings</text>
<line x1="70" y1="360" x2="720" y2="360" stroke="#484f58" stroke-width="1.5"/>
<line x1="70" y1="80" x2="70" y2="360" stroke="#484f58" stroke-width="1.5"/>
<line x1="70" y1="80.0" x2="720" y2="80.0" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3"/>
<text x="716" y="75.0" fill="#ff6b6b" font-size="10" text-anchor="end">ratio = 1 (no compression)</text>
<polyline points="70.0,80.0 167.8,150.0 297.2,208.8 395.0,248.0 524.3,286.1 622.2,306.8 720.0,321.8" fill="none" stroke="#06d6a0" stroke-width="2.2"/>
<circle cx="70.0" cy="80.0" r="4" fill="#06d6a0"/>
<text x="70" y="378" fill="#8b949e" font-size="10" text-anchor="middle">1x</text>
<circle cx="167.8" cy="150.0" r="4" fill="#06d6a0"/>
<text x="168" y="378" fill="#8b949e" font-size="10" text-anchor="middle">2x</text>
<circle cx="297.2" cy="208.8" r="4" fill="#06d6a0"/>
<text x="297" y="378" fill="#8b949e" font-size="10" text-anchor="middle">5x</text>
<circle cx="395.0" cy="248.0" r="4" fill="#06d6a0"/>
<text x="395" y="378" fill="#8b949e" font-size="10" text-anchor="middle">10x</text>
<circle cx="524.3" cy="286.1" r="4" fill="#06d6a0"/>
<text x="524" y="378" fill="#8b949e" font-size="10" text-anchor="middle">25x</text>
<circle cx="622.2" cy="306.8" r="4" fill="#06d6a0"/>
<text x="622" y="378" fill="#8b949e" font-size="10" text-anchor="middle">50x</text>
<circle cx="720.0" cy="321.8" r="4" fill="#06d6a0"/>
<text x="720" y="378" fill="#8b949e" font-size="10" text-anchor="middle">100x</text>
<text x="395" y="408" fill="#8b949e" font-size="12" text-anchor="middle">number of phrase repetitions (log scale)</text>
</svg>