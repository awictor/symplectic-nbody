<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" font-family="monospace">
<rect width="680" height="430" fill="#0d1117"/>
<text x="20" y="30" fill="#e6edf3" font-size="18">A graph realizing the degree sequence [3, 2, 2, 2, 1]</text>
<text x="20" y="50" fill="#8b949e" font-size="12">Havel-Hakimi built this simple graph; each node label is the degree it achieves</text>
<line x1="340.0" y1="90.0" x2="473.1" y2="186.7" stroke="#4dabf7" stroke-width="2"/>
<line x1="340.0" y1="90.0" x2="422.3" y2="343.3" stroke="#4dabf7" stroke-width="2"/>
<line x1="340.0" y1="90.0" x2="257.7" y2="343.3" stroke="#4dabf7" stroke-width="2"/>
<line x1="473.1" y1="186.7" x2="422.3" y2="343.3" stroke="#4dabf7" stroke-width="2"/>
<line x1="257.7" y1="343.3" x2="206.9" y2="186.7" stroke="#4dabf7" stroke-width="2"/>
<circle cx="340.0" cy="90.0" r="22" fill="#06d6a0"/>
<text x="340.0" y="88.0" fill="#0d1117" font-size="12" text-anchor="middle" font-weight="bold">v0</text>
<text x="340.0" y="103.0" fill="#0d1117" font-size="10" text-anchor="middle">deg 3</text>
<circle cx="473.1" cy="186.7" r="22" fill="#06d6a0"/>
<text x="473.1" y="184.7" fill="#0d1117" font-size="12" text-anchor="middle" font-weight="bold">v1</text>
<text x="473.1" y="199.7" fill="#0d1117" font-size="10" text-anchor="middle">deg 2</text>
<circle cx="422.3" cy="343.3" r="22" fill="#06d6a0"/>
<text x="422.3" y="341.3" fill="#0d1117" font-size="12" text-anchor="middle" font-weight="bold">v2</text>
<text x="422.3" y="356.3" fill="#0d1117" font-size="10" text-anchor="middle">deg 2</text>
<circle cx="257.7" cy="343.3" r="22" fill="#06d6a0"/>
<text x="257.7" y="341.3" fill="#0d1117" font-size="12" text-anchor="middle" font-weight="bold">v3</text>
<text x="257.7" y="356.3" fill="#0d1117" font-size="10" text-anchor="middle">deg 2</text>
<circle cx="206.9" cy="186.7" r="22" fill="#06d6a0"/>
