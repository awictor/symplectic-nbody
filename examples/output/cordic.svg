<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="monospace">
<rect width="760" height="430" fill="#0d1117"/>
<text x="20" y="28" fill="#e6edf3" font-size="18">CORDIC: iterative rotation homing in on cos/sin</text>
<text x="20" y="47" fill="#8b949e" font-size="12">each step rotates by +/- arctan(2^-i) (a bit shift); the path spirals to the target angle</text>
<circle cx="250" cy="230" r="160" fill="none" stroke="#30363d" stroke-width="1.5"/>
<line x1="70" y1="230" x2="430" y2="230" stroke="#30363d"/>
<line x1="250" y1="50" x2="250" y2="410" stroke="#30363d"/>
<line x1="250" y1="230" x2="329.4" y2="74.0" stroke="#ffd43b" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="333" y="74" fill="#ffd43b" font-size="11">target 1.1 rad</text>
<polyline points="410.0,230.0 363.1,116.9 300.6,78.2 335.9,95.0 318.5,85.4 327.4,90.0 323.0,87.6 320.7,86.5 321.9,87.0 322.4,87.3 322.7,87.5 322.6,87.4 322.6,87.4" fill="none" stroke="#4dabf7" stroke-width="1.6"/>
<circle cx="410.0" cy="230.0" r="3" fill="#4dabf7"/>
<circle cx="363.1" cy="116.9" r="3" fill="#4dabf7"/>
<circle cx="300.6" cy="78.2" r="3" fill="#4dabf7"/>
<circle cx="335.9" cy="95.0" r="3" fill="#4dabf7"/>
<circle cx="318.5" cy="85.4" r="3" fill="#4dabf7"/>
<circle cx="327.4" cy="90.0" r="3" fill="#4dabf7"/>
<circle cx="323.0" cy="87.6" r="3" fill="#4dabf7"/>
<circle cx="320.7" cy="86.5" r="3" fill="#4dabf7"/>
<circle cx="321.9" cy="87.0" r="3" fill="#4dabf7"/>
<circle cx="322.4" cy="87.3" r="3" fill="#4dabf7"/>
<circle cx="322.7" cy="87.5" r="3" fill="#4dabf7"/>
<circle cx="322.6" cy="87.4" r="3" fill="#4dabf7"/>
<circle cx="322.6" cy="87.4" r="3" fill="#4dabf7"/>
<circle cx="322.6" cy="87.4" r="6" fill="#06d6a0"/>
<text x="500" y="120" fill="#e6edf3" font-size="13">Only shift + add:</text>
<text x="500" y="150" fill="#4dabf7" font-size="12">cos = 0.453596</text>
<text x="500" y="172" fill="#4dabf7" font-size="12">sin = 0.891207</text>
<text x="500" y="205" fill="#8b949e" font-size="11">no multiply, no divide,</text>
<text x="500" y="222" fill="#8b949e" font-size="11">no function lookup</text>
</svg>