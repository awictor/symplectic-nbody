<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="monospace">
<rect width="760" height="380" fill="#0d1117"/>
<text x="20" y="28" fill="#e6edf3" font-size="17">Match time of /(a*)*b/ vs input length -- linear, not exponential</text>
<text x="20" y="47" fill="#8b949e" font-size="12">a backtracking engine would blow up exponentially here; the NFA scales linearly</text>
<line x1="60" y1="320" x2="720" y2="320" stroke="#30363d" stroke-width="1"/>
<line x1="60" y1="320" x2="60" y2="70" stroke="#30363d" stroke-width="1"/>
<polyline points="101.2,303.8 142.5,288.2 225.0,256.7 390.0,192.4 720.0,70.0" fill="none" stroke="#4dabf7" stroke-width="2"/>
<circle cx="101.2" cy="303.8" r="4" fill="#ffd43b"/>
<text x="101" y="294" fill="#8b949e" font-size="10" text-anchor="middle">0.1ms</text>
<circle cx="142.5" cy="288.2" r="4" fill="#ffd43b"/>
<text x="142" y="278" fill="#8b949e" font-size="10" text-anchor="middle">0.2ms</text>
<circle cx="225.0" cy="256.7" r="4" fill="#ffd43b"/>
<text x="225" y="247" fill="#8b949e" font-size="10" text-anchor="middle">0.4ms</text>
<circle cx="390.0" cy="192.4" r="4" fill="#ffd43b"/>
<text x="390" y="182" fill="#8b949e" font-size="10" text-anchor="middle">0.8ms</text>
<circle cx="720.0" cy="70.0" r="4" fill="#ffd43b"/>
<text x="720" y="60" fill="#8b949e" font-size="10" text-anchor="middle">1.7ms</text>
<text x="390" y="350" fill="#8b949e" font-size="12" text-anchor="middle">input length n (characters)</text>
<text x="20" y="68" fill="#8b949e" font-size="11">match time (ms)</text>
</svg>