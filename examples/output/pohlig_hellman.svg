<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="monospace">
<rect width="760" height="340" fill="#0d1117"/>
<text x="20" y="26" fill="#e6edf3" font-size="15">Pohlig-Hellman: one discrete log mod 2028 splits into small prime-power logs</text>
<circle cx="380" cy="80" r="34" fill="#ff6b6b"/>
<text x="380" y="78" fill="#0d1117" font-size="12" text-anchor="middle">log mod</text>
<text x="380" y="92" fill="#0d1117" font-size="12" text-anchor="middle">2028</text>
<line x1="380" y1="114" x2="120" y2="180" stroke="#484f58" stroke-width="1.5"/>
<circle cx="120" cy="210" r="28" fill="#06d6a0"/>
<text x="120" y="208" fill="#0d1117" font-size="11" text-anchor="middle">mod</text>
<text x="120" y="222" fill="#0d1117" font-size="11" text-anchor="middle">4</text>
<text x="120" y="255" fill="#8b949e" font-size="9" text-anchor="middle">= 2^2 subgroup</text>
<line x1="380" y1="114" x2="380" y2="180" stroke="#484f58" stroke-width="1.5"/>
<circle cx="380" cy="210" r="28" fill="#06d6a0"/>
<text x="380" y="208" fill="#0d1117" font-size="11" text-anchor="middle">mod</text>
<text x="380" y="222" fill="#0d1117" font-size="11" text-anchor="middle">3</text>
<text x="380" y="255" fill="#8b949e" font-size="9" text-anchor="middle">= 3^1 subgroup</text>
<line x1="380" y1="114" x2="640" y2="180" stroke="#484f58" stroke-width="1.5"/>
<circle cx="640" cy="210" r="28" fill="#06d6a0"/>
<text x="640" y="208" fill="#0d1117" font-size="11" text-anchor="middle">mod</text>
<text x="640" y="222" fill="#0d1117" font-size="11" text-anchor="middle">169</text>
<text x="640" y="255" fill="#8b949e" font-size="9" text-anchor="middle">= 13^2 subgroup</text>
<text x="380" y="316" fill="#8b949e" font-size="10" text-anchor="middle">each small log by baby-step giant-step, recombined by the Chinese Remainder Theorem</text>
</svg>