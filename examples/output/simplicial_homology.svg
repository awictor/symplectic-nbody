<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="monospace">
<rect width="760" height="380" fill="#0d1117"/>
<text x="20" y="26" fill="#e6edf3" font-size="15">Betti numbers by dimension: components (b0), loops (b1), voids (b2)</text>
<text x="205" y="50" fill="#4dabf7" font-size="10" text-anchor="middle">b0</text>
<text x="275" y="50" fill="#06d6a0" font-size="10" text-anchor="middle">b1</text>
<text x="345" y="50" fill="#ffd43b" font-size="10" text-anchor="middle">b2</text>
<text x="158" y="76" fill="#e6edf3" font-size="11" text-anchor="end">circle S^1</text>
<circle cx="205" cy="72" r="13" fill="#4dabf7"/>
<text x="205" y="76" fill="#0d1117" font-size="11" text-anchor="middle">1</text>
<circle cx="275" cy="72" r="13" fill="#06d6a0"/>
<text x="275" y="76" fill="#0d1117" font-size="11" text-anchor="middle">1</text>
<circle cx="345" cy="72" r="6" fill="#30363d"/>
<text x="345" y="76" fill="#0d1117" font-size="11" text-anchor="middle">0</text>
<text x="395" y="76" fill="#8b949e" font-size="9">1 loop</text>
<text x="158" y="120" fill="#e6edf3" font-size="11" text-anchor="end">disk D^2</text>
<circle cx="205" cy="116" r="13" fill="#4dabf7"/>
<text x="205" y="120" fill="#0d1117" font-size="11" text-anchor="middle">1</text>
<circle cx="275" cy="116" r="6" fill="#30363d"/>
<text x="275" y="120" fill="#0d1117" font-size="11" text-anchor="middle">0</text>
<circle cx="345" cy="116" r="6" fill="#30363d"/>
<text x="345" y="120" fill="#0d1117" font-size="11" text-anchor="middle">0</text>
<text x="395" y="120" fill="#8b949e" font-size="9">contractible</text>
<text x="158" y="164" fill="#e6edf3" font-size="11" text-anchor="end">sphere S^2</text>
<circle cx="205" cy="160" r="13" fill="#4dabf7"/>
<text x="205" y="164" fill="#0d1117" font-size="11" text-anchor="middle">1</text>
<circle cx="275" cy="160" r="6" fill="#30363d"/>
<text x="275" y="164" fill="#0d1117" font-size="11" text-anchor="middle">0</text>
<circle cx="345" cy="160" r="13" fill="#ffd43b"/>
<text x="345" y="164" fill="#0d1117" font-size="11" text-anchor="middle">1</text>
<text x="395" y="164" fill="#8b949e" font-size="9">1 void, no loops</text>
<text x="158" y="208" fill="#e6edf3" font-size="11" text-anchor="end">figure-eight</text>
<circle cx="205" cy="204" r="13" fill="#4dabf7"/>
<text x="205" y="208" fill="#0d1117" font-size="11" text-anchor="middle">1</text>
<circle cx="275" cy="204" r="20" fill="#06d6a0"/>
<text x="275" y="208" fill="#0d1117" font-size="11" text-anchor="middle">2</text>
<circle cx="345" cy="204" r="6" fill="#30363d"/>
<text x="345" y="208" fill="#0d1117" font-size="11" text-anchor="middle">0</text>
<text x="395" y="208" fill="#8b949e" font-size="9">2 loops</text>
<text x="158" y="252" fill="#e6edf3" font-size="11" text-anchor="end">torus T^2</text>
<circle cx="205" cy="248" r="13" fill="#4dabf7"/>
<text x="205" y="252" fill="#0d1117" font-size="11" text-anchor="middle">1</text>
<circle cx="275" cy="248" r="20" fill="#06d6a0"/>
<text x="275" y="252" fill="#0d1117" font-size="11" text-anchor="middle">2</text>
<circle cx="345" cy="248" r="13" fill="#ffd43b"/>
<text x="345" y="252" fill="#0d1117" font-size="11" text-anchor="middle">1</text>
<text x="395" y="252" fill="#8b949e" font-size="9">2 loops, 1 void</text>
<text x="158" y="296" fill="#e6edf3" font-size="11" text-anchor="end">proj plane RP^2</text>
<circle cx="205" cy="292" r="13" fill="#4dabf7"/>
<text x="205" y="296" fill="#0d1117" font-size="11" text-anchor="middle">1</text>
<circle cx="275" cy="292" r="6" fill="#30363d"/>
<text x="275" y="296" fill="#0d1117" font-size="11" text-anchor="middle">0</text>
<circle cx="345" cy="292" r="6" fill="#30363d"/>
<text x="345" y="296" fill="#0d1117" font-size="11" text-anchor="middle">0</text>
<text x="395" y="296" fill="#8b949e" font-size="9">Z/2 torsion (non-orientable)</text>
</svg>