<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="monospace">
<rect width="720" height="420" fill="#0d1117"/>
<text x="20" y="30" fill="#e6edf3" font-size="18">An Eulerian circuit: each edge numbered in the order the trail walks it</text>
<text x="20" y="50" fill="#8b949e" font-size="12">a closed walk crossing all 6 edges exactly once, returning to the start</text>
<line x1="360" y1="210" x2="200" y2="100" stroke="#06d6a0" stroke-width="2.5"/>
<circle cx="280" cy="155" r="11" fill="#0d1117" stroke="#ffd43b" stroke-width="1"/>
<text x="280" y="159" fill="#ffd43b" font-size="11" text-anchor="middle">1</text>
<line x1="200" y1="100" x2="200" y2="320" stroke="#06d6a0" stroke-width="2.5"/>
<circle cx="200" cy="210" r="11" fill="#0d1117" stroke="#ffd43b" stroke-width="1"/>
<text x="200" y="214" fill="#ffd43b" font-size="11" text-anchor="middle">2</text>
<line x1="200" y1="320" x2="360" y2="210" stroke="#06d6a0" stroke-width="2.5"/>
<circle cx="280" cy="265" r="11" fill="#0d1117" stroke="#ffd43b" stroke-width="1"/>
<text x="280" y="269" fill="#ffd43b" font-size="11" text-anchor="middle">3</text>
<line x1="360" y1="210" x2="520" y2="100" stroke="#06d6a0" stroke-width="2.5"/>
<circle cx="440" cy="155" r="11" fill="#0d1117" stroke="#ffd43b" stroke-width="1"/>
<text x="440" y="159" fill="#ffd43b" font-size="11" text-anchor="middle">4</text>
<line x1="520" y1="100" x2="520" y2="320" stroke="#06d6a0" stroke-width="2.5"/>
<circle cx="520" cy="210" r="11" fill="#0d1117" stroke="#ffd43b" stroke-width="1"/>
<text x="520" y="214" fill="#ffd43b" font-size="11" text-anchor="middle">5</text>
<line x1="520" y1="320" x2="360" y2="210" stroke="#06d6a0" stroke-width="2.5"/>
<circle cx="440" cy="265" r="11" fill="#0d1117" stroke="#ffd43b" stroke-width="1"/>
<text x="440" y="269" fill="#ffd43b" font-size="11" text-anchor="middle">6</text>
<circle cx="360" cy="210" r="20" fill="#4dabf7"/>
<text x="360" y="215" fill="#0d1117" font-size="15" text-anchor="middle" font-weight="bold">0</text>
<circle cx="200" cy="100" r="20" fill="#4dabf7"/>
<text x="200" y="105" fill="#0d1117" font-size="15" text-anchor="middle" font-weight="bold">1</text>
<circle cx="200" cy="320" r="20" fill="#4dabf7"/>
<text x="200" y="325" fill="#0d1117" font-size="15" text-anchor="middle" font-weight="bold">2</text>
<circle cx="520" cy="100" r="20" fill="#4dabf7"/>
<text x="520" y="105" fill="#0d1117" font-size="15" text-anchor="middle" font-weight="bold">3</text>
<circle cx="520" cy="320" r="20" fill="#4dabf7"/>
<text x="520" y="325" fill="#0d1117" font-size="15" text-anchor="middle" font-weight="bold">4</text>
<text x="20" y="400" fill="#8b949e" font-size="12">trail: 0->1->2->0->3->4->0</text>
</svg>