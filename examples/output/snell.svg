<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" font-family="monospace">
<rect width="720" height="720" fill="#0d1117"/>
<text x="20" y="34" fill="#e6edf3" font-size="18">Refraction and total internal reflection</text>
<text x="20" y="52" fill="#8b949e" font-size="12">rays leaving water bend away from the normal, then flip to TIR past the critical angle</text>
<rect x="0" y="331.2" width="720" height="388.8" fill="#4dabf7" opacity="0.10"/>
<line x1="0" y1="331.2" x2="720" y2="331.2" stroke="#8b949e" stroke-width="2"/>
<text x="646.0" y="323.2" fill="#8b949e" font-size="11" text-anchor="end">air (n=1.00)</text>
<text x="646.0" y="349.2" fill="#4dabf7" font-size="11" text-anchor="end">water (n=1.333)</text>
<line x1="360.0" y1="191.2" x2="360.0" y2="471.2" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="308.7" y1="472.2" x2="360.0" y2="331.2" stroke="#06d6a0" stroke-width="2"/>
<line x1="360.0" y1="331.2" x2="428.4" y2="197.7" stroke="#06d6a0" stroke-width="2"/>
<line x1="263.6" y1="446.1" x2="360.0" y2="331.2" stroke="#06d6a0" stroke-width="2"/>
<line x1="360.0" y1="331.2" x2="488.5" y2="253.8" stroke="#06d6a0" stroke-width="2"/>
<line x1="247.5" y1="430.4" x2="360.0" y2="331.2" stroke="#ff6b6b" stroke-width="2"/>
<line x1="360.0" y1="331.2" x2="509.9" y2="327.0" stroke="#06d6a0" stroke-width="2"/>
<line x1="230.1" y1="406.2" x2="360.0" y2="331.2" stroke="#ff6b6b" stroke-width="2"/>
<line x1="360.0" y1="331.2" x2="489.9" y2="406.2" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 3"/>
<text x="241.4" y="446.3" fill="#ffd43b" font-size="11" text-anchor="end">critical 48.6 deg</text>
<text x="70.0" y="694.0" fill="#06d6a0" font-size="11">green = refracts out</text>
<text x="650.0" y="694.0" fill="#ff6b6b" font-size="11" text-anchor="end">red = totally reflected (trapped)</text>
</svg>