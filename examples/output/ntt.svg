<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="monospace">
<rect width="760" height="380" fill="#0d1117"/>
<text x="20" y="30" fill="#e6edf3" font-size="18">Exact polynomial product via the NTT</text>
<text x="20" y="50" fill="#8b949e" font-size="12">coefficients of (blue) x (green) = (yellow), each an exact integer -- no rounding</text>
<text x="118" y="108" fill="#4dabf7" font-size="12" text-anchor="end">A</text>
<rect x="130" y="120.0" width="40" height="10.0" fill="#4dabf7"/>
<text x="150" y="144" fill="#8b949e" font-size="10" text-anchor="middle">1</text>
<rect x="176" y="110.0" width="40" height="20.0" fill="#4dabf7"/>
<text x="196" y="144" fill="#8b949e" font-size="10" text-anchor="middle">2</text>
<rect x="222" y="100.0" width="40" height="30.0" fill="#4dabf7"/>
<text x="242" y="144" fill="#8b949e" font-size="10" text-anchor="middle">3</text>
<rect x="268" y="90.0" width="40" height="40.0" fill="#4dabf7"/>
<text x="288" y="144" fill="#8b949e" font-size="10" text-anchor="middle">4</text>
<text x="118" y="188" fill="#06d6a0" font-size="12" text-anchor="end">B</text>
<rect x="130" y="181.4" width="40" height="28.6" fill="#06d6a0"/>
<text x="150" y="224" fill="#8b949e" font-size="10" text-anchor="middle">5</text>
<rect x="176" y="175.7" width="40" height="34.3" fill="#06d6a0"/>
<text x="196" y="224" fill="#8b949e" font-size="10" text-anchor="middle">6</text>
<rect x="222" y="170.0" width="40" height="40.0" fill="#06d6a0"/>
<text x="242" y="224" fill="#8b949e" font-size="10" text-anchor="middle">7</text>
<text x="118" y="278" fill="#ffd43b" font-size="12" text-anchor="end">A*B</text>
<rect x="130" y="296.2" width="40" height="3.8" fill="#ffd43b"/>
<text x="150" y="314" fill="#8b949e" font-size="10" text-anchor="middle">5</text>
<rect x="176" y="287.7" width="40" height="12.3" fill="#ffd43b"/>
<text x="196" y="314" fill="#8b949e" font-size="10" text-anchor="middle">16</text>
<rect x="222" y="273.8" width="40" height="26.2" fill="#ffd43b"/>
<text x="242" y="314" fill="#8b949e" font-size="10" text-anchor="middle">34</text>
<rect x="268" y="260.0" width="40" height="40.0" fill="#ffd43b"/>
<text x="288" y="314" fill="#8b949e" font-size="10" text-anchor="middle">52</text>
<rect x="314" y="265.4" width="40" height="34.6" fill="#ffd43b"/>
<text x="334" y="314" fill="#8b949e" font-size="10" text-anchor="middle">45</text>
<rect x="360" y="278.5" width="40" height="21.5" fill="#ffd43b"/>
<text x="380" y="314" fill="#8b949e" font-size="10" text-anchor="middle">28</text>
<text x="130" y="330" fill="#8b949e" font-size="11">each product coefficient is sum of a[i]*b[j] over i+j=k -- convolution, done exactly</text>
</svg>