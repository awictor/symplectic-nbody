<rect width="760" height="380" fill="#0d1117"/>
<text x="20" y="28" fill="#e6edf3" font-size="17">GJK: two shapes collide iff their Minkowski difference contains the origin</text>
<text x="20" y="47" fill="#8b949e" font-size="12">left: the two overlapping shapes A, B. right: A(-)B with the origin (red) inside it</text>
