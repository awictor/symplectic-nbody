<polygon points="416.0,256.0 528.0,256.0 528.0,172.0 416.0,172.0" fill="#ffd43b" opacity="0.35" stroke="#ffd43b" stroke-width="2"/><text x="472" y="214" fill="#ffd43b" font-size="13" text-anchor="middle">A(-)B</text>
