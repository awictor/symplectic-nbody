<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" font-family="monospace">
<rect width="760" height="390" fill="#0d1117"/>
<text x="20" y="26" fill="#e6edf3" font-size="18">Diffie-Hellman: a shared secret over an open channel</text>
<text x="20" y="44" fill="#8b949e" font-size="12">the exchange both sides can complete (left); the attacker's sqrt(p) vs honest log(p) cost (right)</text>
<rect x="35" y="75" width="165" height="66" rx="6" fill="#161b22" stroke="#4dabf7" stroke-width="1.5"/>
<text x="43.0" y="92.0" fill="#e6edf3" font-size="9">Alice</text>
<text x="43.0" y="106.0" fill="#e6edf3" font-size="9">secret a</text>
<text x="43.0" y="120.0" fill="#e6edf3" font-size="9">sends A = g^a mod p</text>
<text x="43.0" y="134.0" fill="#e6edf3" font-size="9">gets B -> B^a = g^ab</text>
<rect x="35" y="240" width="165" height="66" rx="6" fill="#161b22" stroke="#06d6a0" stroke-width="1.5"/>
<text x="43.0" y="257.0" fill="#e6edf3" font-size="9">Bob</text>
<text x="43.0" y="271.0" fill="#e6edf3" font-size="9">secret b</text>
<text x="43.0" y="285.0" fill="#e6edf3" font-size="9">sends B = g^b mod p</text>
<text x="43.0" y="299.0" fill="#e6edf3" font-size="9">gets A -> A^b = g^ab</text>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffd43b"/></marker></defs>
<line x1="120" y1="141" x2="120" y2="240" stroke="#ffd43b" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="150" y1="240" x2="150" y2="141" stroke="#ffd43b" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="128" y="175" fill="#ffd43b" font-size="9">A</text>
<text x="156" y="205" fill="#ffd43b" font-size="9">B</text>
<rect x="240" y="150" width="175" height="66" rx="6" fill="#161b22" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="248.0" y="167.0" fill="#e6edf3" font-size="9">Eve sees p, g, A, B</text>
<text x="248.0" y="181.0" fill="#e6edf3" font-size="9">needs a = log_g A mod p</text>
<text x="248.0" y="195.0" fill="#e6edf3" font-size="9">discrete log: ~sqrt(p) hard</text>
<text x="118" y="335" fill="#8b949e" font-size="10">Both reach g^ab; Eve never does.</text>
<line x1="435" y1="330" x2="735" y2="330" stroke="#8b949e" stroke-width="1.2"/>
<line x1="435" y1="330" x2="435" y2="75" stroke="#8b949e" stroke-width="1.2"/>
<polyline points="437.5,327.9 457.3,311.0 477.1,294.2 497.0,277.3 516.8,260.5 536.7,243.6 556.5,226.7 576.3,209.9 596.2,193.0 616.0,176.2 635.8,159.3 655.7,142.4 675.5,125.6 695.3,108.7 715.2,91.9 735.0,75.0" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
<polyline points="437.5,328.7 457.3,327.8 477.1,327.6 497.0,327.5 516.8,327.4 536.7,327.3 556.5,327.2 576.3,327.1 596.2,327.1 616.0,327.1 635.8,327.0 655.7,327.0 675.5,326.9 695.3,326.9 715.2,326.9 735.0,326.9" fill="none" stroke="#06d6a0" stroke-width="2.5"/>
<text x="752.4" y="79.0" fill="#ff6b6b" font-size="9" text-anchor="end">attacker ~sqrt(p)</text>
<text x="752.4" y="321.9" fill="#06d6a0" font-size="9" text-anchor="end">honest ~log(p)</text>
<text x="441.0" y="79.0" fill="#8b949e" font-size="9">log10(steps)</text>
<text x="752.4" y="69.0" fill="#ff6b6b" font-size="9" text-anchor="end">~10^308</text>
<text x="437.5" y="345.0" fill="#8b949e" font-size="8" text-anchor="middle">16</text>
<text x="593.7" y="345.0" fill="#8b949e" font-size="8" text-anchor="middle">1024</text>
<text x="752.4" y="345.0" fill="#8b949e" font-size="8" text-anchor="middle">2048</text>
<text x="585.0" y="360.0" fill="#8b949e" font-size="10" text-anchor="middle">prime size (bits)</text>
</svg>