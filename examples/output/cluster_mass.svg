<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" font-family="monospace">
<rect width="720" height="720" fill="#0d1117"/>
<text x="20" y="34" fill="#e6edf3" font-size="18">The mass-to-light ladder</text>
<text x="20" y="52" fill="#8b949e" font-size="12">dynamical M/L climbs from a few (stars) to hundreds (clusters) -- the dark-matter signal</text>
<line x1="80" y1="640" x2="640" y2="640" stroke="#8b949e" stroke-width="1.5"/>
<line x1="80" y1="640" x2="80" y2="140" stroke="#8b949e" stroke-width="1.5"/>
<line x1="80" y1="640.0" x2="640" y2="640.0" stroke="#21262d" stroke-width="1"/>
<text x="72.0" y="644.0" fill="#8b949e" font-size="10" text-anchor="end">1</text>
<line x1="80" y1="473.3" x2="640" y2="473.3" stroke="#21262d" stroke-width="1"/>
<text x="72.0" y="477.3" fill="#8b949e" font-size="10" text-anchor="end">10</text>
<line x1="80" y1="306.7" x2="640" y2="306.7" stroke="#21262d" stroke-width="1"/>
<text x="72.0" y="310.7" fill="#8b949e" font-size="10" text-anchor="end">100</text>
<line x1="80" y1="140.0" x2="640" y2="140.0" stroke="#21262d" stroke-width="1"/>
<text x="72.0" y="144.0" fill="#8b949e" font-size="10" text-anchor="end">1000</text>
<text x="24" y="390.0" fill="#8b949e" font-size="11" transform="rotate(-90 24 390.0)" text-anchor="middle">M/L (solar units)</text>
<rect x="80.0" y="523.5" width="560.0" height="116.5" fill="#8b949e" opacity="0.12"/>
<text x="636.0" y="535.7" fill="#8b949e" font-size="10" text-anchor="end">stars alone</text>
<rect x="111.5" y="640.0" width="77.0" height="0.0" fill="#ffd43b" opacity="0.85"/>
<text x="150.0" y="632.0" fill="#ffd43b" font-size="12" text-anchor="middle">1</text>
<text x="150.0" y="656.0" fill="#8b949e" font-size="10" text-anchor="middle">Sun (star)</text>
<rect x="251.5" y="560.5" width="77.0" height="79.5" fill="#ff922b" opacity="0.85"/>
<text x="290.0" y="552.5" fill="#ff922b" font-size="12" text-anchor="middle">3</text>
<text x="290.0" y="656.0" fill="#8b949e" font-size="10" text-anchor="middle">stellar population</text>
<rect x="391.5" y="393.8" width="77.0" height="246.2" fill="#06d6a0" opacity="0.85"/>
<text x="430.0" y="385.8" fill="#06d6a0" font-size="12" text-anchor="middle">30</text>
<text x="430.0" y="656.0" fill="#8b949e" font-size="10" text-anchor="middle">spiral galaxy (+halo)</text>
<rect x="531.5" y="227.1" width="77.0" height="412.9" fill="#4dabf7" opacity="0.85"/>
<text x="570.0" y="219.1" fill="#4dabf7" font-size="12" text-anchor="middle">300</text>
<text x="570.0" y="656.0" fill="#8b949e" font-size="10" text-anchor="middle">galaxy cluster</text>
</svg>