<line x1="60.0" y1="80" x2="60.0" y2="375" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3"/>
<circle cx="170.0" cy="140.8" r="6" fill="#4dabf7"/>
<text x="170.0" y="128.8" fill="#8b949e" font-size="10" text-anchor="middle">(1,77)</text>
<circle cx="280.0" cy="101.3" r="6" fill="#4dabf7"/>
<text x="280.0" y="89.3" fill="#8b949e" font-size="10" text-anchor="middle">(2,90)</text>
<circle cx="390.0" cy="241.2" r="6" fill="#4dabf7"/>
<text x="390.0" y="229.2" fill="#8b949e" font-size="10" text-anchor="middle">(3,44)</text>
<circle cx="500.0" cy="265.5" r="6" fill="#4dabf7"/>
<text x="500.0" y="253.5" fill="#8b949e" font-size="10" text-anchor="middle">(4,36)</text>
<circle cx="610.0" cy="174.3" r="6" fill="#4dabf7"/>
<text x="610.0" y="162.3" fill="#8b949e" font-size="10" text-anchor="middle">(5,66)</text>
<circle cx="60.0" cy="359.8" r="8" fill="#ffd43b"/>
<text x="70.0" y="363.8" fill="#ffd43b" font-size="13">secret = f(0) = 5</text>
<text x="390" y="418" fill="#8b949e" font-size="12" text-anchor="middle">share index x (secret hidden at x=0)</text>
</svg>