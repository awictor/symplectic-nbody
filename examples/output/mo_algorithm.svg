<rect width="780" height="440" fill="#0d1117"/>
<text x="20" y="30" fill="#e6edf3" font-size="17">Mo's algorithm: query windows drawn in processing order (top to bottom)</text>
<text x="20" y="49" fill="#8b949e" font-size="12">each bar is a query range [l,r]; sorted by left-block then snaking r, so the ends move little</text>
