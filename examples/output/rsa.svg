<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="monospace">
<rect width="760" height="380" fill="#0d1117"/>
<text x="20" y="26" fill="#e6edf3" font-size="18">RSA: encrypt with the public key, decrypt with the private</text>
<text x="20" y="44" fill="#8b949e" font-size="12">the one-way key flow (left); modular-exponentiation cost is linear in bits (right)</text>
<rect x="40" y="80" width="150" height="60" rx="6" fill="#161b22" stroke="#4dabf7" stroke-width="1.5"/>
<text x="115.0" y="98.0" fill="#e6edf3" font-size="10" text-anchor="middle">Alice</text>
<text x="115.0" y="113.0" fill="#e6edf3" font-size="10" text-anchor="middle">has public (e, n)</text>
<text x="115.0" y="128.0" fill="#e6edf3" font-size="10" text-anchor="middle">c = m^e mod n</text>
<rect x="40" y="220" width="150" height="60" rx="6" fill="#161b22" stroke="#06d6a0" stroke-width="1.5"/>
<text x="115.0" y="238.0" fill="#e6edf3" font-size="10" text-anchor="middle">Bob</text>
<text x="115.0" y="253.0" fill="#e6edf3" font-size="10" text-anchor="middle">has private (d, n)</text>
<text x="115.0" y="268.0" fill="#e6edf3" font-size="10" text-anchor="middle">m = c^d mod n</text>
<line x1="115" y1="140" x2="115" y2="220" stroke="#ffd43b" stroke-width="2" marker-end="url(#ah)"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#ffd43b"/></marker></defs>
<text x="123" y="185" fill="#ffd43b" font-size="10">ciphertext c</text>
<text x="123" y="200" fill="#8b949e" font-size="8">(safe on open channel)</text>
<rect x="250" y="150" width="150" height="60" rx="6" fill="#161b22" stroke="#ff6b6b" stroke-width="1.5"/>
<text x="325.0" y="168.0" fill="#e6edf3" font-size="10" text-anchor="middle">Eve (attacker)</text>
<text x="325.0" y="183.0" fill="#e6edf3" font-size="10" text-anchor="middle">sees c, e, n</text>
<text x="325.0" y="198.0" fill="#e6edf3" font-size="10" text-anchor="middle">must factor n: hard</text>
<line x1="420" y1="320" x2="730" y2="320" stroke="#8b949e" stroke-width="1.2"/>
<line x1="420" y1="320" x2="420" y2="80" stroke="#8b949e" stroke-width="1.2"/>
<polyline points="421.3,319.0 441.9,303.1 462.4,287.1 483.0,271.2 503.6,255.3 524.2,239.3 544.8,223.4 565.4,207.5 585.9,191.5 606.5,175.6 627.1,159.7 647.7,143.7 668.3,127.8 688.8,111.9 709.4,95.9 730.0,80.0" fill="none" stroke="#4dabf7" stroke-width="2.5"/>
<circle cx="421.3" cy="319.0" r="2.5" fill="#4dabf7"/>
<text x="421.3" y="335.0" fill="#8b949e" font-size="8" text-anchor="middle">8</text>
<circle cx="584.6" cy="192.5" r="2.5" fill="#4dabf7"/>
<text x="584.6" y="335.0" fill="#8b949e" font-size="8" text-anchor="middle">1024</text>
<circle cx="749.3" cy="65.1" r="2.5" fill="#4dabf7"/>
<text x="749.3" y="335.0" fill="#8b949e" font-size="8" text-anchor="middle">2048</text>
<text x="749.3" y="59.1" fill="#4dabf7" font-size="9" text-anchor="end">~2 log2(e) mults</text>
<text x="575.0" y="350.0" fill="#8b949e" font-size="10" text-anchor="middle">exponent size (bits)</text>
<text x="414.0" y="78.0" fill="#8b949e" font-size="9" text-anchor="end">multiplications</text>
<text x="575.0" y="66.0" fill="#8b949e" font-size="9" text-anchor="middle">(vs 2^bits for naive repeated multiply)</text>
</svg>