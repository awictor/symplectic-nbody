<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="monospace">
<rect width="760" height="430" fill="#0d1117"/>
<text x="20" y="28" fill="#e6edf3" font-size="18">Treap height vs size (keys inserted in sorted order)</text>
<text x="20" y="47" fill="#8b949e" font-size="12">blue = actual treap height, yellow dashed = 2 log2(n); a plain BST here would be height n-1</text>
<line x1="70" y1="375" x2="720" y2="375" stroke="#484f58" stroke-width="1.5"/>
<line x1="70" y1="80" x2="70" y2="375" stroke="#484f58" stroke-width="1.5"/>
<text x="70" y="393" fill="#8b949e" font-size="11" text-anchor="middle">100</text>
<text x="311" y="393" fill="#8b949e" font-size="11" text-anchor="middle">1000</text>
<text x="552" y="393" fill="#8b949e" font-size="11" text-anchor="middle">10000</text>
<text x="720" y="393" fill="#8b949e" font-size="11" text-anchor="middle">50000</text>
<text x="395" y="418" fill="#8b949e" font-size="12" text-anchor="middle">number of keys n (log scale)</text>
<polyline points="70.0,291.2 310.8,249.4 551.7,207.5 720.0,178.2" fill="none" stroke="#ffd43b" stroke-width="1.8" stroke-dasharray="6,4"/>
<polyline points="70.0,299.4 310.8,211.1 551.7,173.3 720.0,129.2" fill="none" stroke="#4dabf7" stroke-width="2.2"/>
<circle cx="70.0" cy="299.4" r="4" fill="#4dabf7"/>
<circle cx="310.8" cy="211.1" r="4" fill="#4dabf7"/>
<circle cx="551.7" cy="173.3" r="4" fill="#4dabf7"/>
<circle cx="720.0" cy="129.2" r="4" fill="#4dabf7"/>
</svg>