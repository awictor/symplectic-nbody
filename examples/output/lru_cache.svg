<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="monospace">
<rect width="760" height="380" fill="#0d1117"/>
<text x="20" y="26" fill="#e6edf3" font-size="18">Cache hit rate: LRU vs LFU by workload</text>
<text x="20" y="44" fill="#8b949e" font-size="12">the best eviction policy depends on the access pattern (cache holds 10 of 200 keys)</text>
<line x1="45" y1="325" x2="730" y2="325" stroke="#8b949e" stroke-width="1.2"/>
<line x1="45" y1="325" x2="45" y2="75" stroke="#8b949e" stroke-width="1.2"/>
<line x1="45" y1="262.5" x2="730" y2="262.5" stroke="#21262d" stroke-width="1"/>
<text x="40" y="266.5" fill="#8b949e" font-size="9" text-anchor="end">25%</text>
<line x1="45" y1="200.0" x2="730" y2="200.0" stroke="#21262d" stroke-width="1"/>
<text x="40" y="204.0" fill="#8b949e" font-size="9" text-anchor="end">50%</text>
<line x1="45" y1="137.5" x2="730" y2="137.5" stroke="#21262d" stroke-width="1"/>
<text x="40" y="141.5" fill="#8b949e" font-size="9" text-anchor="end">75%</text>
<line x1="45" y1="75.0" x2="730" y2="75.0" stroke="#21262d" stroke-width="1"/>
<text x="40" y="79.0" fill="#8b949e" font-size="9" text-anchor="end">100%</text>
<rect x="70.0" y="313.7" width="67.0" height="11.3" fill="#4dabf7"/>
<text x="103.5" y="309.7" fill="#4dabf7" font-size="9" text-anchor="middle">5%</text>
<rect x="143.0" y="312.6" width="67.0" height="12.4" fill="#ff922b"/>
<text x="176.5" y="308.6" fill="#ff922b" font-size="9" text-anchor="middle">5%</text>
<text x="137.0" y="341.0" fill="#8b949e" font-size="10" text-anchor="middle">uniform random</text>
<rect x="293.3" y="268.2" width="67.0" height="56.8" fill="#4dabf7"/>
<text x="326.8" y="264.2" fill="#4dabf7" font-size="9" text-anchor="middle">23%</text>
<rect x="366.3" y="246.2" width="67.0" height="78.8" fill="#ff922b"/>
<text x="399.8" y="242.2" fill="#ff922b" font-size="9" text-anchor="middle">32%</text>
<text x="360.3" y="341.0" fill="#8b949e" font-size="10" text-anchor="middle">skewed (hot keys)</text>
<rect x="516.7" y="325.0" width="67.0" height="0.0" fill="#4dabf7"/>
<text x="550.2" y="321.0" fill="#4dabf7" font-size="9" text-anchor="middle">0%</text>
<rect x="589.7" y="325.0" width="67.0" height="0.0" fill="#ff922b"/>
<text x="623.2" y="321.0" fill="#ff922b" font-size="9" text-anchor="middle">0%</text>
<text x="583.7" y="341.0" fill="#8b949e" font-size="10" text-anchor="middle">looping sweep</text>
<rect x="600" y="60" width="11" height="7" fill="#4dabf7"/>
<text x="615" y="67" fill="#8b949e" font-size="10">LRU</text>
<rect x="660" y="60" width="11" height="7" fill="#ff922b"/>
<text x="675" y="67" fill="#8b949e" font-size="10">LFU</text>
