<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" font-family="monospace">
<rect width="720" height="720" fill="#0d1117"/>
<text x="20" y="34" fill="#e6edf3" font-size="18">The Mach cone at M = 2</text>
<text x="20" y="52" fill="#8b949e" font-size="12">each wavelet expands at the sound speed; the source outruns them, leaving a cone of half-angle arcsin(1/M)</text>
<line x1="50.0" y1="288.0" x2="670.0" y2="288.0" stroke="#21262d" stroke-width="1"/>
<circle cx="490.0" cy="288.0" r="65.0" fill="none" stroke="#4dabf7" stroke-width="1.6" opacity="0.7"/>
<circle cx="360.0" cy="288.0" r="130.0" fill="none" stroke="#4dabf7" stroke-width="1.6" opacity="0.7"/>
<circle cx="230.0" cy="288.0" r="195.0" fill="none" stroke="#4dabf7" stroke-width="1.6" opacity="0.7"/>
<circle cx="100.0" cy="288.0" r="260.0" fill="none" stroke="#4dabf7" stroke-width="1.6" opacity="0.7"/>
<line x1="620.0" y1="288.0" x2="147.2" y2="15.0" stroke="#ff6b6b" stroke-width="2.4"/>
<line x1="620.0" y1="288.0" x2="147.2" y2="561.0" stroke="#ff6b6b" stroke-width="2.4"/>
<path d="M 560.0 288.0 A 60 60 0 0 0 568.0 258.0" fill="none" stroke="#ffd43b" stroke-width="1.5"/>
<text x="528.0" y="268.0" fill="#ffd43b" font-size="13">mu = 30 deg</text>
<polygon points="632.0,288.0 612.0,282.0 612.0,294.0" fill="#e6edf3"/>
<text x="616.0" y="274.0" fill="#e6edf3" font-size="11" text-anchor="end">source at Mach 2</text>
<line x1="50.0" y1="612.0" x2="670.0" y2="612.0" stroke="#8b949e" stroke-width="2"/>
<text x="60.0" y="632.0" fill="#8b949e" font-size="11">the cone sweeps the ground as a continuous sonic-boom carpet along the flight track</text>
<circle cx="58.8" cy="612.0" r="5" fill="#ff6b6b"/>
<line x1="620.0" y1="288.0" x2="58.8" y2="612.0" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
</svg>