<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="monospace">
<rect width="760" height="420" fill="#0d1117"/>
<text x="20" y="26" fill="#e6edf3" font-size="18">Simple vs self-intersecting polygons</text>
<text x="20" y="44" fill="#8b949e" font-size="12">green = simple (no non-adjacent edges cross); red = self-intersecting</text>
<polygon points="70.0,215.0 195.0,215.0 195.0,90.0 70.0,90.0" fill="#06d6a0" fill-opacity="0.12" stroke="#06d6a0" stroke-width="2"/>
<circle cx="70.0" cy="215.0" r="3" fill="#06d6a0"/>
<circle cx="195.0" cy="215.0" r="3" fill="#06d6a0"/>
<circle cx="195.0" cy="90.0" r="3" fill="#06d6a0"/>
<circle cx="70.0" cy="90.0" r="3" fill="#06d6a0"/>
<text x="70.0" y="94.0" fill="#e6edf3" font-size="11">square (simple)</text>
<polygon points="475.0,215.0 575.0,215.0 600.0,140.0 525.0,90.0 450.0,140.0" fill="#06d6a0" fill-opacity="0.12" stroke="#06d6a0" stroke-width="2"/>
<circle cx="475.0" cy="215.0" r="3" fill="#06d6a0"/>
<circle cx="575.0" cy="215.0" r="3" fill="#06d6a0"/>
<circle cx="600.0" cy="140.0" r="3" fill="#06d6a0"/>
<circle cx="525.0" cy="90.0" r="3" fill="#06d6a0"/>
<circle cx="450.0" cy="140.0" r="3" fill="#06d6a0"/>
<text x="450.0" y="94.0" fill="#e6edf3" font-size="11">convex pentagon (simple)</text>
<polygon points="70.0,390.0 195.0,390.0 195.0,265.0 132.5,327.5 70.0,265.0" fill="#06d6a0" fill-opacity="0.12" stroke="#06d6a0" stroke-width="2"/>
<circle cx="70.0" cy="390.0" r="3" fill="#06d6a0"/>
<circle cx="195.0" cy="390.0" r="3" fill="#06d6a0"/>
<circle cx="195.0" cy="265.0" r="3" fill="#06d6a0"/>
<circle cx="132.5" cy="327.5" r="3" fill="#06d6a0"/>
<circle cx="70.0" cy="265.0" r="3" fill="#06d6a0"/>
<text x="70.0" y="269.0" fill="#e6edf3" font-size="11">arrow (non-convex) (simple)</text>
<polygon points="450.0,390.0 575.0,265.0 575.0,390.0 450.0,265.0" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b" stroke-width="2"/>
<circle cx="450.0" cy="390.0" r="3" fill="#ff6b6b"/>
<circle cx="575.0" cy="265.0" r="3" fill="#ff6b6b"/>
<circle cx="575.0" cy="390.0" r="3" fill="#ff6b6b"/>
<circle cx="450.0" cy="265.0" r="3" fill="#ff6b6b"/>
<text x="450.0" y="269.0" fill="#e6edf3" font-size="11">figure-eight (self-crossing) (self-intersecting)</text>
</svg>