<text x="730.0" y="144.7" fill="#06d6a0" font-size="9" text-anchor="end">Fenwick O(log n)</text>
<text x="600.0" y="166.0" fill="#8b949e" font-size="9" text-anchor="middle">n (log) -> ops per query (log)</text>
