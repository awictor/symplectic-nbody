<text x="40" y="372.0" fill="#8b949e" font-size="10">A prefix sum to k adds the nodes covering [0,k): strip the low bit each step, log n adds.</text>
<line x1="470" y1="150" x2="730" y2="150" stroke="#8b949e" stroke-width="1.2"/>
<line x1="470" y1="150" x2="470" y2="70" stroke="#8b949e" stroke-width="1.2"/>
<polyline points="470.0,134.0 535.0,118.0 600.0,102.0 665.0,86.0 730.0,70.0" fill="none" stroke="#ff6b6b" stroke-width="2"/>
<polyline points="470.0,142.0 535.0,138.0 600.0,135.7 665.0,134.0 730.0,132.7" fill="none" stroke="#06d6a0" stroke-width="2.5"/>
